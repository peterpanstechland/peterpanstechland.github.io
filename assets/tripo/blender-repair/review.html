<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>车库模型 · Blender 修复对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11181c;color:#e5ecee;font:16px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:32px}h1{font-size:30px;margin:0}p{color:#a3b5bd}.toolbar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:24px 0}select,a{border:1px solid #52676e;border-radius:6px;padding:10px 14px;color:#cfede7;background:#1d2a2e;font:inherit}a{text-decoration:none}label{display:flex;gap:12px;align-items:center}.views{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}img{display:block;width:100%;border-radius:8px;background:#45545c}figcaption{padding:10px 0;font-weight:600}#notes{min-height:3em;padding:18px 22px;border-left:3px solid #6bc8b3;background:#1a262a}.back{max-width:700px;margin:30px auto}footer{color:#9daeb5;font-size:14px;margin-top:30px}@media(max-width:760px){main{padding:18px}.views{grid-template-columns:1fr}h1{font-size:24px}}
</style>
<main>
<h1>车库模型 · Blender 修复对比</h1>
<p>相同相机和灯光下的实际模型渲染。原始 Tripo 文件保留，本轮新增积分消耗 0。</p>
<div class="toolbar"><label>模型<select id="asset"></select></label><a id="glb" download>下载修复 GLB</a><a id="blend" download>下载 Blender 工程</a><a href="http://127.0.0.1:4173/zh-Hans/maker-garage-preview/scene/?lang=zh-Hans&amp;view=interior&amp;v=blender-repair-v1">车库实景预览 ↗</a></div>
<div class="views"><figure><img id="before" alt="修复前模型"><figcaption>修复前</figcaption></figure><figure><img id="after" alt="Blender 修复后模型"><figcaption>Blender 修复后</figcaption></figure></div>
<p id="notes"></p><figure class="back"><img id="back" alt="修复后背面检查"><figcaption>修复后 · 背面检查</figcaption></figure>
<footer>本轮范围：9 款室内设备与家具。新制零件在 Blender 中以 LOCAL_ 命名；保留部分以 TRIPO_ 或原任务名称标识。小字、细电缆和旋钮仍是展示级精度。电脑主机的两份严重变形输出仍被排除，车库外部模型本轮未修改。</footer>
</main>
<script>
const items=[
['14_bambu_x1c','拓竹 X1C','移除翘曲打印平台，补制平整打印板、加热底板、底架和后部支撑；保留机舱壁厚与原始打印头。'],
['15_makeblock_laserbox','Makeblock Laserbox','移除破碎、凹陷的观察窗，补制平整烟色窗口；修正侧板与外壳着色。'],
['16_openpnp_machine','OpenPnP 贴片机','校正底座正面和外侧龙门支架，保留吸嘴、送料区与 PCB；修正法线。'],
['17_soldering_station','焊台','校平控制器顶板、侧板，降低异常凹凸反光；保留烙铁与线缆。'],
['18_hot_air_station','热风枪与控制台','校平底座台面及控制器侧壁，修正法线；保留热风枪、支架与软管。'],
['19_oscilloscope','示波器','校平机壳顶面、改善着色，保留面板旋钮、接口及手柄。'],
['21_monitor','双显示器共用模型','校平显示面和底部接触面，保留原支架与后壳。'],
['22_office_desk','办公桌','保留木桌面与抽屉，替换扭曲桌腿，补制方管支架、横撑及脚垫。'],
['23_workbench','工作台','保留带原贴图的上围边，重建桌腿、支撑横梁、实体钢台面与下层搁板。']];
const select=document.getElementById('asset');
for(const [id,name]of items){const option=document.createElement('option');option.value=id;option.textContent=name;select.append(option)}
function show(){const [id,name,note]=items.find(x=>x[0]===select.value);for(const suffix of ['before','after','back'])document.getElementById(suffix).src=`renders/${id}-${suffix}.png`;document.getElementById('notes').textContent=note;document.getElementById('glb').href=`models/${id}.glb`;document.getElementById('blend').href=`blend/${id}.blend`;history.replaceState(null,'',`#${id}`)}
if(items.some(x=>`#${x[0]}`===location.hash))select.value=location.hash.slice(1);select.addEventListener('change',show);show();
</script>
</html>
