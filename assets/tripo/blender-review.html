<h1>全场景 21 个模型 · Blender 优化对比</h1>
<p>相同相机和灯光下的实际模型渲染。原始 Tripo 文件保留，累计 21 个在用模型，新增积分消耗 0。</p>
<div class="toolbar"><label>模型<select id="asset"></select></label><a id="glb" download>下载修复 GLB</a><a id="blend" download>下载 Blender 工程</a><a href="http://127.0.0.1:4173/zh-Hans/maker-garage-preview/scene/?lang=zh-Hans&amp;view=interior&amp;v=blender-garage-v1">车库实景预览 ↗</a></div>
<div class="views"><figure><img id="before" alt="修复前模型"><figcaption>修复前</figcaption></figure><figure><img id="after" alt="Blender 修复后模型"><figcaption>Blender 修复后</figcaption></figure></div>
<p id="notes"></p><figure class="back"><img id="back" alt="修复后背面检查"><figcaption>修复后 · 背面检查</figcaption></figure>
<footer>21 个在用模型均已处理；两台显示器共用一款模型。原始下载保留。历史上未通过验收的旧工具区和电脑主机输出仍不接入场景。细小文字、旋钮和线缆仍是展示级精度。新制部件以 LOCAL_ 命名。<br><a href="GARAGE_BLENDER_REPORT.json">优化与验证记录</a></footer>
</main>
<script>
const items=[["01_garage_shell", "车库外壳", "Blender 优化：校平屋顶并分件；清除室内悬空破面，补制完整天花板和地板，保留外围结构与做旧细节。 原始 Tripo 输出保留。", "blender-garage", "01_garage_shell.glb"], ["02_roller_shutter", "独立卷帘门", "Blender 优化：逐片清理门片与着色，保留 26 片独立轴心、涂鸦和开关参数。 原始 Tripo 输出保留。", "blender-garage", "02_roller_shutter.glb"], ["03_profile_sign", "头像招牌框", "Blender 优化：清理圆形招牌框接缝与异常反光，保留霓虹分段。 原始 Tripo 输出保留。", "blender-garage", "03_profile_sign.glb"], ["04_lucky_cat", "英短赛博招财猫", "Blender 优化：改善猫身着色，保留原骨骼、权重与招手动作。 原始 Tripo 输出保留。", "blender-garage", "04_cyber_lucky_cat.glb"], ["05_project_vending", "项目自动贩卖机", "Blender 优化：校平柜顶、改善硬表面着色，保留展示窗与出货口。 原始 Tripo 输出保留。", "blender-garage", "05_project_vending.glb"], ["06_showcase_zone", "作品展示区", "Blender 优化：把破损搁板补为三层实体钢搁板，保留分隔与下柜。 原始 Tripo 输出保留。", "blender-garage", "06_showcase_zone.glb"], ["08_street_lamp", "路灯", "Blender 优化：修正杆体着色，为悬空控制盒补上两根钢支架。 原始 Tripo 输出保留。", "blender-garage", "08_street_lamp.glb"], ["09_trash_bin", "垃圾桶", "Blender 优化：清理底部尖刺与后部破片，补制平整底座和后板。 原始 Tripo 输出保留。", "blender-garage", "09_trash_bin.glb"], ["10_utility_cabinet", "电箱", "Blender 优化：校平顶盖并修正机柜着色，保留通风口、铰链与把手。 原始 Tripo 输出保留。", "blender-garage", "10_utility_cabinet.glb"], ["11_tree", "小树", "Blender 优化：清理冗余几何与底部接触面，保留树叶轮廓。 原始 Tripo 输出保留。", "blender-garage", "11_tree.glb"], ["12_plants_grass", "盆栽草地", "Blender 优化：清理几何、稳定盆底接触面，保留植物与草地分离。 原始 Tripo 输出保留。", "blender-garage", "12_plants_grass.glb"], ["13_street_base", "街道路沿", "Blender 优化：把薄片街道重建为闭合实体底座，烘焙保留原路面颜色与表面细节。 原始 Tripo 输出保留。", "blender-garage", "13_street_base.glb"], ["14_bambu_x1c", "拓竹 X1 Carbon", "Blender 修复：打印平台补制为平整打印板、加热底板和支架，保留原机舱与打印头。 原始 Tripo 输出保留；这是场景展示模型，品牌与屏幕文字后期制作。", "blender-repair", "14_bambu_x1c.glb"], ["15_makeblock_laserbox", "Makeblock Laserbox", "Blender 修复：替换破碎观察窗，校正侧板，保留原外壳。 原始 Tripo 输出保留；这是场景展示模型，品牌与屏幕文字后期制作。", "blender-repair", "15_makeblock_laserbox.glb"], ["16_openpnp_machine", "OpenPnP 桌面贴片机", "Blender 修复：校正底座与龙门支架表面，保留吸嘴、送料区和 PCB。 原始 Tripo 输出保留；这是场景展示模型，品牌与屏幕文字后期制作。", "blender-repair", "16_openpnp_machine.glb"], ["17_soldering_station", "焊台", "Blender 修复：校平控制器顶面与侧壁，修正异常反光。 原始 Tripo 输出保留；这是场景展示模型，品牌与屏幕文字后期制作。", "blender-repair", "17_soldering_station.glb"], ["18_hot_air_station", "热风枪与控制台", "Blender 修复：校平底座台面与控制器侧壁，保留热风枪与软管。 原始 Tripo 输出保留；这是场景展示模型，品牌与屏幕文字后期制作。", "blender-repair", "18_hot_air_station.glb"], ["19_oscilloscope", "示波器", "Blender 修复：校平机壳顶面并修正着色，保留面板和接口。 原始 Tripo 输出保留；这是场景展示模型，品牌与屏幕文字后期制作。", "blender-repair", "19_oscilloscope.glb"], ["21_monitor", "双显示器", "Blender 修复：校平屏幕与底部接触面，保留支架与后壳。 原始 Tripo 输出保留；这是场景展示模型，品牌与屏幕文字后期制作。", "blender-repair", "21_monitor.glb"], ["22_office_desk", "办公桌", "Blender 修复：保留木桌面和抽屉，补制规整方管桌架、横撑和脚垫。 原始 Tripo 输出保留；这是场景展示模型，品牌与屏幕文字后期制作。", "blender-repair", "22_office_desk.glb"], ["23_workbench", "工作台", "Blender 修复：保留原贴图上围边，重建桌架、实体钢台面和下层搁板。 原始 Tripo 输出保留；这是场景展示模型，品牌与屏幕文字后期制作。", "blender-repair", "23_workbench.glb"]];
const select=document.getElementById('asset');
for(const [id,name]of items){const option=document.createElement('option');option.value=id;option.textContent=name;select.append(option)}
function show(){const [id,name,note,folder,file]=items.find(x=>x[0]===select.value);for(const suffix of ['before','after','back'])document.getElementById(suffix).src=`${folder}/renders/${id}-${suffix}.png`;document.getElementById('notes').textContent=note;document.getElementById('glb').href=`${folder}/models/${file}`;document.getElementById('blend').href=`${folder}/blend/${id}.blend`;history.replaceState(null,'',`#${id}`)}
if(items.some(x=>`#${x[0]}`===location.hash))select.value=location.hash.slice(1);select.addEventListener('change',show);show();
</script>
</html>
