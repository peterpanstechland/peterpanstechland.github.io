# Native tripo-cli 0.7.1 batch manifest; prepared offline only, not submitted.
# Run from the repository root. Inputs and parameters reproduce the approved dry-run files.
# IMPORTANT: retries is a CLI option, not a manifest field. The CLI default is 1.
# Required execution flags: --concurrency 2 --retries 0. Do not use --fresh.
# No scenario, post-processing chain, paid conversion, candidate reroll or automatic retry.
# Estimate: 5 text-to-model jobs x 20 + 5 image-to-model jobs x 30 = 250 Tripo credits.
concurrency: 2
defaults:
  out: assets/tripo/raw
jobs:
  - name: 03_profile_sign
    input: Original Shenzhen cyberpunk maker garage diorama prop. Charcoal black and smoky purple metal, coral-magenta and restrained cyan accent lights, warm amber work lighting, believable handmade details and weathering. A complete three-dimensional object with real side and rear surfaces. No webpage, no UI, no watermark, no cat-head brand logo, no human portrait, no generated text. Keep luminous surfaces distinct from opaque metal. A freestanding round wall-mounted neon portrait-sign FRAME, circular shallow black metal disc, two concentric magenta and cyan light tubes, mounting bracket and tidy cable. The central circular surface is plain opaque black, absolutely no person or face and no cat symbol. Generate only the sign hardware; the user's existing profile photo will be applied later, not AI-generated.
    model: tripo-v3.1
    params:
      face_limit: 5000
      texture: true
      pbr: true
      texture_quality: standard
      auto_size: true
  - name: 05_project_vending
    input: PeterPansTechland_Tripo_Generation_Pack/references/05_project_vending.png
    model: tripo-v3.1
    params:
      face_limit: 12000
      texture: true
      pbr: true
      texture_quality: standard
      auto_size: true
