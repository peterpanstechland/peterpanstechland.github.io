name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Serialize deployments to prevent GitHub Pages from rejecting concurrent publishes.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Deterministic generation of 6 real GLB assets before Docusaurus copies /static.
      - name: Generate Cyber Maker Garage 3D assets
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "trimesh>=4,<5" "Pillow>=10,<13"
          python tools/generate_3d_models.py --out static/maker-house/models
          python - <<'PY'
          from pathlib import Path
          p=Path('static/maker-house/models')
          expected=['maker-garage.glb','neko-luckycat.glb','pan-cocktail-robot.glb','flipfate-machine.glb','bmo-companion.glb','roomba-camera-bot.glb']
          for file in expected:
              blob=p/file
              assert blob.exists() and blob.stat().st_size>1000, f"Missing/empty 3D asset: {file}"
              assert blob.read_bytes()[:4]==b'glTF', f"Not a GLB: {file}"
          print('Validated all six GLB assets.')
          PY

      - name: Build website
        run: npm run build
        
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
