<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1020" role="img" aria-labelledby="title desc">
<title id="title">RoboPlanter 当前硬件连接 · 2026-10-29</title><desc id="desc">手机加密BLE连接XIAO；Indicator通过同一局域网HTTP连接XIAO，土壤接Indicator。SEN54独立5V。用户确认12V/150mA泵已接，水箱未完成，泵禁用。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#51795e"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#20372a}.h{font-size:25px;font-weight:700}.t{font-size:18px}.s{font-size:16px;fill:#4b6053}.wire{fill:none;stroke:#51795e;stroke-width:3;marker-end:url(#arrow)}.card{fill:#fffdf6;stroke:#b4c5b1;stroke-width:1.5}</style>
<rect width="1280" height="1020" rx="28" fill="#f3f1e6"/>
<text x="40" y="50" class="h">工位搭子 / 当前硬件连接</text><text x="40" y="80" class="s">2026-10-29 · 端口逻辑示意，按实物丝印识别 pin1 · 非工程比例图</text>

<rect class="card" x="40" y="110" width="345" height="142" rx="16"/>
<text class="h" x="60" y="144">Robot Phone / YOYO</text>
<text class="t" x="60" y="176">Skill 0.4.0 → 官方 BLE 工具</text>
<text class="t" x="60" y="203">SC + MITM 加密绑定</text>
<text class="t" x="60" y="230">六位码在 Indicator 上查看</text>
<rect class="card" x="535" y="110" width="705" height="142" rx="16"/>
<text class="h" x="555" y="144">XIAO ESP32-S3 Plus · Robot Board V1.0</text>
<text class="t" x="555" y="176">采集环境、灯光、打印、共享番茄钟</text>
<text class="t" x="555" y="203">独立 USB / 5V 供电；HTTP 使用私有令牌</text>
<text class="t" x="555" y="230">水箱未完成，泵禁用；GPIO43 与 M2/J9 不使用</text>
<path class="wire" d="M385 176 H535"/><text class="s" x="401" y="160">加密 BLE</text>
<rect class="card" x="40" y="302" width="345" height="207" rx="16"/>
<text class="h" x="60" y="336">SenseCAP Indicator D1</text>
<text class="t" x="60" y="368">独立 USB / 5V；触摸与显示</text>
<text class="t" x="60" y="395">Grove ADC：RP2040 GPIO27</text>
<text class="t" x="60" y="422">  → 电容土壤，3.3V / GND</text>
<text class="t" x="60" y="449">内置蜂鸣器：RP2040 GPIO19</text>
<text class="t" x="60" y="476">备用 I²C：SDA20 / SCL21 留空</text>
<path class="wire" d="M385 355 H465 V230 H535"/><text class="s" x="402" y="285">同一 Wi-Fi</text><text class="s" x="404" y="309">鉴权 HTTP</text>
<rect class="card" x="535" y="302" width="705" height="135" rx="16"/>
<text class="h" x="555" y="336">IIC1 / J11 → SEN54（IIC2 同总线备用）</text>
<text class="t" x="555" y="368">pin2 SDA = GPIO5 · pin1 SCL = GPIO6 · 地址 0x69</text>
<text class="t" x="555" y="395">红线独立 5V；信号/上拉 3.3V；黑线共地</text>
<text class="t" x="555" y="422">IIC pin3 的 3.3V 不接 SEN54 红线，不反灌 5V</text>
<rect class="card" x="535" y="461" width="335" height="135" rx="16"/>
<text class="h" x="555" y="495">SERVO1 / J1 → 继电器</text>
<text class="t" x="555" y="527">pin1 D15 / GPIO42 → SIG</text>
<text class="t" x="555" y="554">模块 3.3–5V / 共地；白线空</text>
<text class="t" x="555" y="581">12V / 150mA 泵已接 · 待水箱</text>
<rect class="card" x="895" y="461" width="345" height="135" rx="16"/>
<text class="h" x="915" y="495">SERVO2 / J5 → 超声波</text>
<text class="t" x="915" y="527">pin1 D9 / GPIO8 → 单 SIG</text>
<text class="t" x="915" y="554">独立 3.3V / GND；白线空</text>
<text class="t" x="915" y="581">v2.0 探头干燥，水箱待标定</text>
<rect class="card" x="535" y="620" width="335" height="135" rx="16"/>
<text class="h" x="555" y="654">SERVO3 / J13 → 环境光</text>
<text class="t" x="555" y="686">pin1 D0 / GPIO1 → OUT</text>
<text class="t" x="555" y="713">独立 3.3V / GND；白线空</text>
<text class="t" x="555" y="740">Light v1.2；替换旧 UV</text>
<rect class="card" x="895" y="620" width="345" height="135" rx="16"/>
<text class="h" x="915" y="654">RGB / J7 → WS2813</text>
<text class="t" x="915" y="686">pin1 D13 / GPIO40 → DIN</text>
<text class="t" x="915" y="713">5V / GND · 板载信号缓冲</text>
<text class="t" x="915" y="740">10 颗灯珠 · 亮度 24/255</text>
<rect class="card" x="535" y="779" width="705" height="135" rx="16"/>
<text class="h" x="555" y="813">SERVO4 / J14 + UART / J10 → EM5826H</text>
<text class="t" x="555" y="845">J14 pin1 D8 / GPIO7 → 打印机 RX；SERVO4 不接泵/舵机</text>
<text class="t" x="555" y="872">打印机 TX（3.3V）→ J10 pin2 D7 / GPIO44</text>
<text class="t" x="555" y="899">打印机独立 12V / 共地；GPIO43 留空，避开上电日志</text>
<path class="wire" d="M887 252 V302"/>
<rect class="card" x="40" y="550" width="425" height="206" rx="16"/>
<text class="h" x="60" y="584">当前版本的替换关系</text>
<text class="t" x="60" y="616">SEN54 → 温湿度 / PM2.5 / VOC</text>
<text class="t" x="60" y="643">DHT20 与旧 Air Quality 拆下备用</text>
<text class="t" x="60" y="670">UV → Light v1.2；土壤在 Indicator</text>
<text class="t" x="60" y="697">SEN54 不测 CO₂ 或 NOx</text>
<text class="t" x="60" y="724">SERVO 插座供电非通用 3.3V</text>
<rect class="card" x="40" y="786" width="425" height="128" rx="16"/>
<text class="h" x="60" y="820">已验证与下一步</text>
<text class="t" x="60" y="852">YOYO 实时土壤 / 温湿度已通过</text>
<text class="t" x="60" y="879">日签比例、预览一致、切纸已通过</text>
<text class="t" x="60" y="906">手机动作及真实泵负载继续验收</text>
<text x="40" y="963" class="t">换线前断电 · 共地不等于共用电源 · 传感器红线按表分线，不能整根插入 Servo 口</text><text x="40" y="992" class="s">www: peterpanstechland.github.io/docs/projects/2026/roboplanter/hardware-wiring</text></svg>
