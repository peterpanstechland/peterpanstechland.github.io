<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#171728" />
  <title>Maker House / Peter Pan's Techland</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
    body{font-family:system-ui,sans-serif}
    canvas{width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
    #fallback{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
    #fallback svg{width:min(82%,540px);height:auto;opacity:.83}
    #fallbackNotice{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;color:#c7bbc9;font-size:11px;letter-spacing:.03em;display:none}
  </style>
</head>
<body>
  <div id="fallback" aria-hidden="true">
    <svg viewBox="0 0 600 380" role="presentation" xmlns="http://www.w3.org/2000/svg">
      <path d="M300 23 542 143 300 274 58 143Z" fill="#33324b" stroke="#82729c" stroke-width="2"/>
      <path d="M58 143v104l242 117V274Z" fill="#29283a" stroke="#645874" stroke-width="2"/>
      <path d="M542 143v104L300 364v-90Z" fill="#201f33" stroke="#645874" stroke-width="2"/>
      <path d="M94 143 300 44 506 143 300 247Z" fill="#3c344b" stroke="#605b73"/>
      <path d="M106 153 179 117 237 146 164 182Z" fill="#9a81b0"/><path d="M106 153v56l58 28v-55Z" fill="#453958"/><path d="M237 146v56l-73 35v-55Z" fill="#716384"/>
      <path d="m236 183 70-34 73 35-72 36Z" fill="#8c819d"/><path d="m236 183v55l71 35v-53Z" fill="#493f5f"/><path d="m379 184v54l-72 35v-53Z" fill="#716581"/>
      <path d="m345 112 65-32 81 40-66 32Z" fill="#bf88a5"/><path d="m345 112v43l80 39v-42Z" fill="#6b4264"/><path d="m491 120v43l-66 31v-42Z" fill="#825674"/>
      <path d="m194 244 104-50 85 41-105 50Z" fill="#a185b4"/><path d="m194 244v31l84 41v-31Z" fill="#53445f"/><path d="m383 235v31l-105 50v-31Z" fill="#695777"/>
      <path d="m246 197 52-25 45 23-52 23Z" fill="#df9cb9" opacity=".83"/>
      <path d="m172 115 25-13 20 10-25 12Z" fill="#82c8d1"/><path d="m192 125v-31" stroke="#9de2e9" stroke-width="5"/>
      <path d="m401 104 45 23" stroke="#f3c1d7" stroke-width="5" stroke-linecap="round"/>
      <path d="m224 274 53 24" stroke="#f0b6d0" stroke-width="3"/>
    </svg>
    <span id="fallbackNotice">Interactive 3D is unavailable; the rest of the site is ready.</span>
  </div>
  <script type="module">
    let THREE;
    try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js'); }
    catch {
      try { THREE = await import('https://unpkg.com/three@0.170.0/build/three.module.js'); }
      catch { document.getElementById('fallbackNotice').style.display='block'; }
    }
    if(THREE) {
      try { start(THREE); }
      catch(error) { document.getElementById('fallbackNotice').style.display='block'; console.warn('Maker House fallback',error); }
    }
    function start(T) {
      const renderer = new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'default'});
      renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
      renderer.setSize(innerWidth,innerHeight);
      renderer.setClearColor(0x151524,0);
      renderer.outputColorSpace = T.SRGBColorSpace;
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.5;
      document.body.appendChild(renderer.domElement);
      document.getElementById('fallback').style.display='none';
      const scene=new T.Scene();
      const camera=new T.PerspectiveCamera(39,innerWidth/innerHeight,.1,100);
      const target=new T.Vector3(0,1.25,0);
      const look=new T.Vector3().copy(target);
      let theta=.68,phi=.92,radius=18;
      let desiredTheta=theta,desiredPhi=phi,desiredRadius=radius;
      let focusId='bench';
      const clickable=[];
      const colors={dark:0x24263a,frame:0x6a6679,top:0x59566a,wall:0x302d42,pink:0xde739e,blue:0x78acbf,ivory:0xe3dce4};
      const mat=(c,metal=.1,rough=.7)=>new T.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});
      const dark=mat(colors.dark),metal=mat(colors.frame,.55,.43),tableMat=mat(colors.top,.3,.57);
      const pink=mat(colors.pink,.1,.42),blue=mat(colors.blue,.18,.5),screen= new T.MeshBasicMaterial({color:0x82a9b9});
      const addBox=(parent,w,h,d,x,y,z,m=dark)=>{
        const a=new T.Mesh(new T.BoxGeometry(w,h,d),m);a.position.set(x,y,z);parent.add(a);return a;
      };
      const addCyl=(parent,rt,rb,h,x,y,z,m=metal)=>{
        const a=new T.Mesh(new T.CylinderGeometry(rt,rb,h,16),m);a.position.set(x,y,z);parent.add(a);return a;
      };
      const floor=new T.Group();scene.add(floor);
      addBox(floor,13.6,.34,10,0,-.2,0,mat(0x303044,.23,.82));
      addBox(floor,13.72,.07,10.14,0,-.41,0,mat(0x7e536d,.3,.52));
      addBox(floor,13.6,3.2,.16,0,1.47,-5.0,mat(colors.wall,.18,.83));
      addBox(floor,.14,3.2,10,-6.8,1.47,0,mat(0x333044,.18,.8));
      // A back-wall tool rack: subtle color highlights instead of repeated labels.
      addBox(floor,7.8,1.35,.11,-.9,2.2,-4.88,mat(0x3a3548));
      for(let i=0;i<15;i++) for(let j=0;j<4;j++) addCyl(floor,.025,.025,.03,-4.5+i*.52,1.78+j*.26,-4.80,mat(0x686073));
      addBox(floor,1.3,1.05,.13,5.3,2.0,-4.88,mat(0x2b3148));
      addBox(floor,.8,.5,.025,5.3,2.09,-4.78,screen);
      for(const x of [-5.8,5.8]) addCyl(floor,.09,.09,2.7,x,1.33,-4.65,metal);
      addBox(floor,12.0,.085,.14,0,3.15,-4.65,pink);
      // Decorative robot silhouette in the corner.
      const bot=new T.Group();bot.position.set(-5.6,0,3.0);scene.add(bot);
      addCyl(bot,.33,.38,.7,0,.65,0,mat(0x75658a));
      addBox(bot,.7,.6,.48,0,1.28,0,mat(0x504966));
      for(const x of [-.18,.18])addBox(bot,.12,.08,.035,x,1.35,.26,screen);
      for(const x of [-.42,.42]){const arm=addBox(bot,.13,.75,.16,x,.98,0,metal);arm.rotation.z=x<0?-.25:.25;}
      // Low-contrast floor guides visually organize the equipment layout.
      for(const z of [-2.65,.8])addBox(floor,11.3,.012,.025,0,.016,z,mat(0x5a4b6d));
      const stations=[];
      function stand(id,x,z,accent,build){
        const g=new T.Group();g.position.set(x,0,z);g.userData.id=id;scene.add(g);stations.push(g);clickable.push(g);
        const glow=new T.Mesh(new T.CircleGeometry(1.27,32),new T.MeshBasicMaterial({color:accent,transparent:true,opacity:.04,depthWrite:false}));
        glow.rotation.x=-Math.PI/2;glow.position.y=.035;g.add(glow);
        g.userData.glow=glow;
        addBox(g,2.35,.12,1.55,0,.84,0,tableMat);
        for(const x of [-1.01,1.01])for(const z of [-.61,.61])addBox(g,.08,.8,.08,x,.41,z,metal);
        build(g);
        return g;
      }
      stand('printer',-4.2,-3.1,0xbe93d8,g=>{
        for(const x of [-.60,.60])addBox(g,.07,1.18,.07,x,1.48,-.15,metal);
        addBox(g,1.32,.07,.9,0,2.05,-.14,metal);
        addBox(g,1.15,.10,.8,0,1.03,-.14,dark);
        addBox(g,.66,.20,.46,0,1.14,0,mat(0x9873ac));
        addBox(g,.23,.17,.25,0,1.86,-.14,pink);
      });
      stand('laser',-1.43,-3.1,0x89b6c5,g=>{
        addBox(g,1.8,.48,1.18,0,1.16,0,mat(0x55566d));
        const lid=addBox(g,1.72,.06,1.08,0,1.45,.02,mat(0x90b2c2,.3,.3));
        lid.rotation.x=-.17;
        addBox(g,.8,.07,.08,0,1.06,.6,blue);
      });
      stand('pnp',1.38,-3.1,0xe6a1bf,g=>{
        addBox(g,1.82,.13,1.08,0,1.02,0,dark);
        for(const x of [-.82,.82])addBox(g,.07,.85,.08,x,1.47,-.35,metal);
        addBox(g,1.80,.1,.1,0,1.84,-.36,pink);
        addBox(g,.3,.45,.22,.20,1.58,-.28,metal);
        for(let i=0;i<5;i++)addBox(g,.20,.06,.56,-.7+i*.32,1.13,.19,mat(0x816d8c));
      });
      stand('bench',4.22,-3.1,0xf19fbb,g=>{
        addBox(g,.93,.63,.1,-.46,1.42,-.36,mat(0x2d425e));
        addBox(g,.78,.53,.1,.5,1.46,-.38,mat(0x484466));
        addBox(g,1.55,.045,.45,0,1.04,.28,metal);
        addBox(g,.26,.15,.2,.85,1.10,.39,pink);
      });
      stand('scope',-3.4,.65,0x8db3d2,g=>{
        addBox(g,1.28,.83,.54,0,1.28,-.17,mat(0x424358));
        addBox(g,.79,.5,.04,-.14,1.3,.12,screen);
        for(let j=0;j<3;j++)addCyl(g,.07,.07,.03,.44,1.54-j*.22,.14,metal);
      });
      stand('microscope',-.45,.65,0xa6d0d0,g=>{
        addCyl(g,.39,.42,.12,0,.96,-.1,metal);
        addCyl(g,.085,.1,1.2,-.27,1.54,-.24,metal);
        const head=addBox(g,.54,.43,.60,0,1.96,-.14,mat(0x747c96));head.rotation.z=-.20;
        addCyl(g,.15,.18,.37,.10,1.62,.01,blue);
      });
      stand('solder',2.37,.65,0xea9d99,g=>{
        addBox(g,.88,.38,.61,-.26,1.09,-.03,mat(0x5b4c61));
        addBox(g,.54,.08,.09,-.26,1.22,.29,pink);
        const iron=addBox(g,.09,.09,.86,.44,1.30,0,metal);iron.rotation.y=.55;
        addCyl(g,.23,.23,.12,.65,1.03,.25,metal);
      });
      stand('hotair',4.97,.65,0xe3c59b,g=>{
        addBox(g,.78,.70,.62,-.22,1.25,-.12,mat(0x555364));
        addBox(g,.5,.08,.06,-.22,1.43,.2,blue);
        const nozzle=addCyl(g,.08,.11,.76,.45,1.35,-.06,mat(0xa8a0ae));nozzle.rotation.z=.64;
      });
      const light=new T.HemisphereLight(0xe9e0f3,0x363247,3.1);scene.add(light);
      const key=new T.DirectionalLight(0xffe0ea,3.8);key.position.set(4,12,8);scene.add(key);
      const fill=new T.DirectionalLight(0xa49bd6,1.4);fill.position.set(-5,6,-2);scene.add(fill);
      function post(type,id){window.parent.postMessage({channel:'techland-maker-house',type,id},window.location.origin);}
      function focus(id,notify=true){
        const g=stations.find(s=>s.userData.id===id);
        if(!g)return;
        focusId=id;
        for(const s of stations){s.userData.glow.material.opacity=s===g?.26:.025;}
        // Overview stays legible: focusing highlights equipment instead of moving the camera aggressively.
        if(notify)post('tool',id);
      }
      function reset(){
        desiredTheta=.68;desiredPhi=.92;desiredRadius=18;target.set(0,1.25,0);focus('bench');
      }
      focus('bench',false);
      window.addEventListener('message',event=>{
        if(event.origin!==window.location.origin||event.data?.channel!=='techland-maker-house')return;
        if(event.data.action==='focus')focus(event.data.id);
        if(event.data.action==='reset')reset();
      });
      const ray=new T.Raycaster(),pointer=new T.Vector2();
      let down=null;
      function pick(event){
        const r=renderer.domElement.getBoundingClientRect();
        pointer.set((event.clientX-r.left)/r.width*2-1,-(event.clientY-r.top)/r.height*2+1);
        ray.setFromCamera(pointer,camera);
        const intersections=ray.intersectObjects(clickable,true);
        if(!intersections.length)return null;
        let obj=intersections[0].object;
        while(obj&&!obj.userData?.id)obj=obj.parent;
        return obj?.userData?.id||null;
      }
      renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,moved:false};});
      renderer.domElement.addEventListener('pointermove',e=>{
        if(down){
          const dx=e.clientX-down.x,dy=e.clientY-down.y;
          if(Math.abs(dx)+Math.abs(dy)>4)down.moved=true;
          if(down.moved){
            desiredTheta+=dx*.005;
            desiredPhi=Math.min(1.02,Math.max(.35,desiredPhi+dy*.004));
            down.x=e.clientX;down.y=e.clientY;
          }
        }else{
          renderer.domElement.style.cursor=pick(e)?'pointer':'grab';
        }
      });
      renderer.domElement.addEventListener('pointerup',e=>{
        if(down&&!down.moved){const id=pick(e);if(id)focus(id);}
        down=null;
      });
      renderer.domElement.addEventListener('pointercancel',()=>{down=null;});
      renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();desiredRadius=Math.max(13.5,Math.min(23,desiredRadius+e.deltaY*.011));},{passive:false});
      const onResize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};
      window.addEventListener('resize',onResize);
      function animate(){
        requestAnimationFrame(animate);
        theta+=(desiredTheta-theta)*.09;
        phi+=(desiredPhi-phi)*.09;
        radius+=(desiredRadius-radius)*.09;
        camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));
        look.lerp(target,.08);
        camera.lookAt(look);
        renderer.render(scene,camera);
      }
      post('ready');animate();
    }
  </script>
</body>
</html>
