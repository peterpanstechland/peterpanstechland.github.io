 renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();desiredDist=Math.max(13,Math.min(29,desiredDist+e.deltaY*.012));},{passive:false});
 window.addEventListener('message',event=>{
   if(event.origin!==window.location.origin||event.data?.channel!=='techland-maker-house')return;
   if(event.data.action==='enter')enterGarage();
   if(event.data.action==='reset')reset();
   if(event.data.action==='focus')select(event.data.id);
 });
 const resize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};
 window.addEventListener('resize',resize);
 const clock=new T.Clock();
 const isMobile=innerWidth<760; if(isMobile){desiredDist=26;distance=26;cameraTarget.set(2.5,2.4,0);}
 function tick(){
   requestAnimationFrame(tick);
   const dt=Math.min(.1,clock.getDelta()),t=clock.elapsedTime;
   azimuth+=(desiredAz-azimuth)*.075;elevation+=(desiredEl-elevation)*.075;distance+=(desiredDist-distance)*.075;
   smoothTarget.lerp(cameraTarget,.07);
   camera.position.set(smoothTarget.x+distance*Math.sin(elevation)*Math.sin(azimuth),
     smoothTarget.y+distance*Math.cos(elevation),smoothTarget.z+distance*Math.sin(elevation)*Math.cos(azimuth));
   camera.lookAt(smoothTarget);
   const targetOpacity=focused?.07:.98;roofMat.opacity+=(targetOpacity-roofMat.opacity)*.08;
   frontFrame.visible=!focused;entrance.visible=!focused;
   // All animations are subtle and respect reduced motion. Imported animated GLBs take precedence.
   if(!reducedMotion){
     for(const part of originals){
       const character=part.type==='cat'?'luckycat':part.type==='pan'?'pan':'flipfate';
       if(resolve(character)?.imported)continue;
       if(part.type==='cat')part.pivot.rotation.z=-.27+Math.sin(t*3.1)*.33;
       if(part.type==='pan')part.pivot.rotation.z=Math.sin(t*1.8)*.22;
       if(part.type==='flip')part.pivot.rotation.y=Math.sin(t*1.18)*.95;
     }
     const bot=resolve('roomba');
     if(bot&&!bot.imported){bot.root.position.x=3.55+Math.sin(t*.44)*.50;bot.root.rotation.y=Math.sin(t*.53)*.20;}
     const companion=resolve('bmo');
     if(companion&&!companion.imported)companion.stand.rotation.z=Math.sin(t*1.20)*.025;
     accent.intensity=75+Math.sin(t*1.4)*4;
   }
   mixers.forEach(mix=>mix.update(reducedMotion?0:dt));
   renderer.render(scene,camera);
 }
 post('ready');tick();
}
</script></body></html>
